# Local Postgres for CareLanka. Everyone on the team runs the same database version,
# on the same port, with the same credentials, so a connection string that works on one
# machine works on all four.
#
#   docker compose up -d      start it
#   docker compose down       stop it (data is kept)
#   docker compose down -v    stop it and throw the data away
#
# These credentials are for local development only. Production reads them from
# environment variables, never from a committed file.

services:
  postgres:
    image: postgres:16-alpine
    container_name: carelanka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: carelanka
      POSTGRES_USER: carelanka
      POSTGRES_PASSWORD: carelanka
    ports:
      - "5433:5432"
    volumes:
      - carelanka-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carelanka -d carelanka"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carelanka-pgdata:
