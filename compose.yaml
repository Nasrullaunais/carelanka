services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: carelanka
      POSTGRES_USER: carelanka
      POSTGRES_PASSWORD: carelanka_dev
    volumes:
      - carelanka_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carelanka -d carelanka"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: migrate
    environment:
      ConnectionStrings__CareLanka: Host=db;Port=5432;Database=carelanka;Username=carelanka;Password=carelanka_dev
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db-setup:
    build:
      context: .
      dockerfile: deploy/db-setup/Dockerfile
    environment:
      PGHOST: db
      PGDATABASE: carelanka
      PGUSER: carelanka
      PGPASSWORD: carelanka_dev
      CARELANKA_DB_APP_PASSWORD: carelanka_app_dev
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CareLanka: Host=db;Port=5432;Database=carelanka;Username=carelanka_app;Password=carelanka_app_dev
      Jwt__SigningKey: ${CARELANKA_JWT_SIGNING_KEY:?Set CARELANKA_JWT_SIGNING_KEY in .env}
      LanguageModel__ApiKey: ${CARELANKA_GEMINI_API_KEY:-}
    ports:
      - "127.0.0.1:5231:5231"
    depends_on:
      db-setup:
        condition: service_completed_successfully

volumes:
  carelanka_db:
