<rect x="12" y="98" width="1276" height="106" rx="8" fill="#e6f5ec" opacity="0.55"/>
<text x="24" y="119" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1  Flutter: the patient sends how they are feeling</text>
<rect x="12" y="212" width="1276" height="344" rx="8" fill="#f1ecfa" opacity="0.55"/>
<text x="24" y="233" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2  ASP.NET Core: checks and queues the run</text>
<rect x="12" y="564" width="1276" height="424" rx="8" fill="#fdeef3" opacity="0.55"/>
<text x="24" y="585" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">3–4  Agentic AI: draft and check the reply (every step saved in PostgreSQL)</text>
<rect x="12" y="996" width="1276" height="202" rx="8" fill="#e3f0fc" opacity="0.55"/>
<text x="24" y="1017" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">5  React: a doctor or ward nurse reviews the draft</text>
<rect x="12" y="1206" width="1276" height="270" rx="8" fill="#fff4e0" opacity="0.55"/>
<text x="24" y="1227" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">6  Shared status: the result goes back to the patient</text>
<rect x="15" y="20" width="230" height="62" rx="9" fill="#e6f5ec" stroke="#2e8b57" stroke-width="2.2"/>
<text x="130" y="46.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Patient</text>
<text x="130" y="68.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Flutter app</text>
<rect x="275" y="20" width="230" height="62" rx="9" fill="#f1ecfa" stroke="#6a4fb3" stroke-width="2.2"/>
<text x="390" y="46.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ASP.NET Core</text>
<text x="390" y="68.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Web API</text>
<rect x="535" y="20" width="230" height="62" rx="9" fill="#e8f1f8" stroke="#2b5d8a" stroke-width="2.2"/>
<text x="650" y="58.0" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">PostgreSQL</text>
<rect x="795" y="20" width="230" height="62" rx="9" fill="#fdeef3" stroke="#b8336a" stroke-width="2.2"/>
<text x="910" y="46.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Care Advisory</text>
<text x="910" y="68.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Agent (worker)</text>
<rect x="1055" y="20" width="230" height="62" rx="9" fill="#e3f0fc" stroke="#1f6fb2" stroke-width="2.2"/>
<text x="1170" y="46.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Doctor / Ward nurse</text>
<text x="1170" y="68.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">React app</text>
<text x="260.0" y="142.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">POST /api/me/care-queries</text>
<text x="260.0" y="161.52" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">(JWT + message from the “How are you feeling?” card)</text>
<line x1="130" y1="180" x2="387" y2="180" stroke="#333" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="200.0" y="248" width="380" height="76" rx="6" fill="#fffbe6" stroke="#c9a227" stroke-width="1.6"/>
<text x="390" y="272.0" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Check the JWT and validate the message.</text>
<text x="390" y="292.0" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Patient comes from the token, not the body.</text>
<text x="390" y="312.0" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Must be admitted; at most 3 messages a minute.</text>
<text x="520.0" y="350.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Save CareRecommendation (pending_review)</text>
<text x="520.0" y="369.52" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+ AgentWorkflow (pending, objective, plan)</text>
<line x1="390" y1="388" x2="647" y2="388" stroke="#333" stroke-width="2.2" marker-end="url(#a)"/>
<text x="780.0" y="418.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Live alert: “a reply is waiting” (SignalR)</text>
<line x1="390" y1="436" x2="1167" y2="436" stroke="#333" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/>
<text x="650.0" y="466.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Queue the agent run (background worker)</text>
<line x1="390" y1="484" x2="907" y2="484" stroke="#333" stroke-width="2.2" marker-end="url(#a)"/>
<text x="260.0" y="514.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">202 Accepted + workflow id</text>
<line x1="390" y1="532" x2="133" y2="532" stroke="#333" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/>
<rect x="730.0" y="600" width="360" height="36" rx="6" fill="#fffbe6" stroke="#c9a227" stroke-width="1.6"/>
<text x="910" y="624.0" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Screen the message for emergency words</text>
<text x="780.0" y="662.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Read-only tools: medical profile, history, admission</text>
<line x1="910" y1="680" x2="653" y2="680" stroke="#333" stroke-width="2.2" marker-end="url(#a)"/>
<text x="780.0" y="710.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Patient facts</text>
<line x1="650" y1="728" x2="907" y2="728" stroke="#333" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/>
<rect x="730.0" y="750" width="360" height="56" rx="6" fill="#f4f4f4" stroke="#666" stroke-width="1.6"/>
<text x="910" y="774.0" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ask Google Gemini for a draft reply</text>
<text x="910" y="794.0" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">that links the message to the record</text>
<rect x="730.0" y="824" width="360" height="76" rx="6" fill="#fffbe6" stroke="#c9a227" stroke-width="1.6"/>
<text x="910" y="848.0" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Check the draft against rules CR1–CR5.</text>
<text x="910" y="868.0" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Broken rule: Gemini gets one retry,</text>
<text x="910" y="888.0" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">then the fixed template is used instead.</text>
<text x="780.0" y="926.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Save draft, steps, tool calls, check results</text>
<text x="780.0" y="945.52" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">workflow → pending_approval</text>
<line x1="910" y1="964" x2="653" y2="964" stroke="#333" stroke-width="2.2" marker-end="url(#a)"/>
<text x="780.0" y="1040.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">GET /api/care-recommendations (review queue)</text>
<line x1="1170" y1="1058" x2="393" y2="1058" stroke="#333" stroke-width="2.2" marker-end="url(#a)"/>
<text x="780.0" y="1088.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Patient's message, draft and the facts it used</text>
<line x1="390" y1="1106" x2="1167" y2="1106" stroke="#333" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/>
<text x="780.0" y="1136.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">POST …/approve (edits allowed)  ·  …/reject (reason)</text>
<text x="780.0" y="1155.52" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">·  …/redraft (back to step 3–4 with a new run)</text>
<line x1="1170" y1="1174" x2="393" y2="1174" stroke="#333" stroke-width="2.2" marker-end="url(#a)"/>
<text x="520.0" y="1250.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Save approved or rejected,</text>
<text x="520.0" y="1269.52" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">who reviewed it and when</text>
<line x1="390" y1="1288" x2="647" y2="1288" stroke="#333" stroke-width="2.2" marker-end="url(#a)"/>
<text x="260.0" y="1318.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Approved only: push “your reply is ready” (Firebase)</text>
<line x1="390" y1="1336" x2="133" y2="1336" stroke="#333" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/>
<text x="260.0" y="1366.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">GET /api/me/care-recommendations</text>
<line x1="130" y1="1384" x2="387" y2="1384" stroke="#333" stroke-width="2.2" marker-end="url(#a)"/>
<text x="260.0" y="1414.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">The approved reply, with the reviewer's name.</text>
<text x="260.0" y="1433.52" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1a1a1a" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">A rejected draft is never shown.</text>
<line x1="390" y1="1452" x2="133" y2="1452" stroke="#333" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/>
</svg>