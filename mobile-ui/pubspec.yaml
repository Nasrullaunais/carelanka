name: carelanka_mobile
description: CareLanka mobile app (Flutter) — ambulance crew, ward nurses, staff and patients.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

# Packages are listed here as the agreed baseline for the whole team.
# Add a package only if your feature needs it, and tell the group — this file
# is shared, so two people editing it at once causes merge conflicts.
dependencies:
  flutter:
    sdk: flutter

  # HTTP + API access (core/network). swagger_parser generates a Retrofit
  # client, so dio is the transport and `http` is no longer used by anything.
  dio: ^5.7.0
  retrofit: ^4.4.1
  json_annotation: ^4.12.0
  http: ^1.2.0
  web: ^1.1.1

  # Routing (core/routing)
  go_router: ^14.0.0

  # State management — assignment rubric §8 requires state management
  provider: ^6.1.2

  # Secure token storage — rubric requires "secure API integration"
  flutter_secure_storage: ^9.0.0

  # Dates the way a person writes them (core/utils/friendly_date.dart).
  # Hand-rolled padLeft formatting cannot do "Fri, 18 Sep" or a locale.
  intl: ^0.20.3

  # The patient code as a scannable card, for the reception desk.
  qr_flutter: ^4.1.0

  # `tel:` links — calling the hospital or your own emergency contact.
  url_launcher: ^6.3.2
  geolocator: ^14.0.2

  # OPD lab reports: photograph a printed report, or attach its PDF.
  image_picker: ^1.1.2
  file_picker: ^8.3.7

  # Push alerts for the ambulance crew when the app is closed (core/push).
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generates lib/services/api_client/ from the API's OpenAPI document.
  # Never hand-write an HTTP call for a CareLanka endpoint — see CLAUDE.md.
  swagger_parser: ^1.44.3
  build_runner: ^2.4.13
  retrofit_generator: ^10.2.11
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
