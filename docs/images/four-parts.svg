<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" font-family="Liberation Sans, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">The four parts of CareLanka</title><desc id="d">Emergency, Staff, Equipment and Patient. Each part has web screens, phone screens and one AI helper.</desc>
<rect x="0.0" y="0.0" width="960.0" height="630.0" rx="22" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
<rect x="20.0" y="20.0" width="452.0" height="267.0" rx="16" fill="#ffffff" stroke="#D0D7DE" stroke-width="1"/>
<path d="M20.0 94.0 V36.0 Q20.0 20.0 36.0 20.0 H456.0 Q472.0 20.0 472.0 36.0 V94.0 Z" fill="#C8641E"/>
<text x="40.0" y="53.0" font-size="24" fill="#ffffff" font-weight="700">Emergency</text>
<text x="40.0" y="78.0" font-size="14.5" fill="#ffffff" fill-opacity="0.95">Gets an ambulance to the patient fast</text>
<rect x="40.0" y="112.0" width="66.0" height="22.0" rx="11" fill="#FDF0E6"/>
<text x="73.0" y="127.0" font-size="11.5" fill="#C8641E" font-weight="700" text-anchor="middle">WEB</text>
<text x="120.0" y="127.0" font-size="14" fill="#1F2937">Live call board, fleet map, dispatch confirmation,</text>
<text x="120.0" y="146.0" font-size="14" fill="#1F2937">cancellations and reports</text>
<rect x="40.0" y="162.0" width="66.0" height="22.0" rx="11" fill="#FDF0E6"/>
<text x="73.0" y="177.0" font-size="11.5" fill="#C8641E" font-weight="700" text-anchor="middle">PHONE</text>
<text x="120.0" y="177.0" font-size="14" fill="#1F2937">Ambulance crew: My run, route and handover.</text>
<text x="120.0" y="196.0" font-size="14" fill="#1F2937">Patients: report and track an emergency</text>
<rect x="40.0" y="212.0" width="66.0" height="22.0" rx="11" fill="#6B4FBB"/>
<text x="73.0" y="227.0" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">AI</text>
<text x="120.0" y="227.0" font-size="14" fill="#1F2937" font-weight="700">Dispatch and Routing</text>
<text x="120.0" y="246.0" font-size="14" fill="#5B6472">Ranks free ambulances by road travel time. The duty</text>
<text x="120.0" y="265.0" font-size="14" fill="#5B6472">manager confirms.</text>
<rect x="488.0" y="20.0" width="452.0" height="267.0" rx="16" fill="#ffffff" stroke="#D0D7DE" stroke-width="1"/>
<path d="M488.0 94.0 V36.0 Q488.0 20.0 504.0 20.0 H924.0 Q940.0 20.0 940.0 36.0 V94.0 Z" fill="#2271B3"/>
<text x="508.0" y="53.0" font-size="24" fill="#ffffff" font-weight="700">Staff</text>
<text x="508.0" y="78.0" font-size="14.5" fill="#ffffff" fill-opacity="0.95">Keeps every ward covered by the right people</text>
<rect x="508.0" y="112.0" width="66.0" height="22.0" rx="11" fill="#E6F0FA"/>
<text x="541.0" y="127.0" font-size="11.5" fill="#2271B3" font-weight="700" text-anchor="middle">WEB</text>
<text x="588.0" y="127.0" font-size="14" fill="#1F2937">Staff records, shifts, ward coverage, leave approval</text>
<text x="588.0" y="146.0" font-size="14" fill="#1F2937">and rosters</text>
<rect x="508.0" y="162.0" width="66.0" height="22.0" rx="11" fill="#E6F0FA"/>
<text x="541.0" y="177.0" font-size="11.5" fill="#2271B3" font-weight="700" text-anchor="middle">PHONE</text>
<text x="588.0" y="177.0" font-size="14" fill="#1F2937">My shifts and leave requests</text>
<rect x="508.0" y="200.0" width="66.0" height="22.0" rx="11" fill="#6B4FBB"/>
<text x="541.0" y="215.0" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">AI</text>
<text x="588.0" y="215.0" font-size="14" fill="#1F2937" font-weight="700">Staff Allocation</text>
<text x="588.0" y="234.0" font-size="14" fill="#5B6472">Suggests who can fill a gap, using fixed rules. The</text>
<text x="588.0" y="253.0" font-size="14" fill="#5B6472">administrator approves.</text>
<rect x="20.0" y="303.0" width="452.0" height="267.0" rx="16" fill="#ffffff" stroke="#D0D7DE" stroke-width="1"/>
<path d="M20.0 377.0 V319.0 Q20.0 303.0 36.0 303.0 H456.0 Q472.0 303.0 472.0 319.0 V377.0 Z" fill="#2E8B57"/>
<text x="40.0" y="336.0" font-size="24" fill="#ffffff" font-weight="700">Equipment</text>
<text x="40.0" y="361.0" font-size="14.5" fill="#ffffff" fill-opacity="0.95">Keeps beds, medicines and machines ready</text>
<rect x="40.0" y="395.0" width="66.0" height="22.0" rx="11" fill="#E7F5EC"/>
<text x="73.0" y="410.0" font-size="11.5" fill="#2E8B57" font-weight="700" text-anchor="middle">WEB</text>
<text x="120.0" y="410.0" font-size="14" fill="#1F2937">Equipment, pharmacy and prescriptions,</text>
<text x="120.0" y="429.0" font-size="14" fill="#1F2937">maintenance, warnings and the laboratory</text>
<rect x="40.0" y="445.0" width="66.0" height="22.0" rx="11" fill="#E7F5EC"/>
<text x="73.0" y="460.0" font-size="11.5" fill="#2E8B57" font-weight="700" text-anchor="middle">PHONE</text>
<text x="120.0" y="460.0" font-size="14" fill="#1F2937">Confirm new equipment and repairs, lab reports and</text>
<text x="120.0" y="479.0" font-size="14" fill="#1F2937">prescriptions</text>
<rect x="40.0" y="495.0" width="66.0" height="22.0" rx="11" fill="#6B4FBB"/>
<text x="73.0" y="510.0" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">AI</text>
<text x="120.0" y="510.0" font-size="14" fill="#1F2937" font-weight="700">Reorder-Threshold</text>
<text x="120.0" y="529.0" font-size="14" fill="#5B6472">Suggests when a medicine should be reordered. The</text>
<text x="120.0" y="548.0" font-size="14" fill="#5B6472">equipment manager approves.</text>
<rect x="488.0" y="303.0" width="452.0" height="267.0" rx="16" fill="#ffffff" stroke="#D0D7DE" stroke-width="1"/>
<path d="M488.0 377.0 V319.0 Q488.0 303.0 504.0 303.0 H924.0 Q940.0 303.0 940.0 319.0 V377.0 Z" fill="#B83266"/>
<text x="508.0" y="336.0" font-size="24" fill="#ffffff" font-weight="700">Patient</text>
<text x="508.0" y="361.0" font-size="14.5" fill="#ffffff" fill-opacity="0.95">Follows a patient from arrival to going home</text>
<rect x="508.0" y="395.0" width="66.0" height="22.0" rx="11" fill="#FBE9F0"/>
<text x="541.0" y="410.0" font-size="11.5" fill="#B83266" font-weight="700" text-anchor="middle">WEB</text>
<text x="588.0" y="410.0" font-size="14" fill="#1F2937">Admissions, patients, bed capacity, discharge, billing</text>
<text x="588.0" y="429.0" font-size="14" fill="#1F2937">and care reply review</text>
<rect x="508.0" y="445.0" width="66.0" height="22.0" rx="11" fill="#FBE9F0"/>
<text x="541.0" y="460.0" font-size="11.5" fill="#B83266" font-weight="700" text-anchor="middle">PHONE</text>
<text x="588.0" y="460.0" font-size="14" fill="#1F2937">Patients: my stay, bill, visits, bookings, reports and</text>
<text x="588.0" y="479.0" font-size="14" fill="#1F2937">&quot;How are you feeling?&quot;</text>
<rect x="508.0" y="495.0" width="66.0" height="22.0" rx="11" fill="#6B4FBB"/>
<text x="541.0" y="510.0" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">AI</text>
<text x="588.0" y="510.0" font-size="14" fill="#1F2937" font-weight="700">Care Advisory</text>
<text x="588.0" y="529.0" font-size="14" fill="#5B6472">Drafts a reply about how a patient feels. A doctor or</text>
<text x="588.0" y="548.0" font-size="14" fill="#5B6472">ward nurse approves it first.</text>
<text x="480.0" y="612.0" font-size="14" fill="#5B6472" text-anchor="middle">All four share one server and one database. Every table has exactly one owner.</text>
</svg>
